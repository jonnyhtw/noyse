name: Black formatting & Python syntax check

on:
  push:                      # all branches
  pull_request:
    branches: [ main, master ]

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-and-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Check Black formatting (no changes allowed)
        run: black --check --diff --color .

      - name: Syntax check (compile all .py files)
        run: |
          python -m compileall -q .


