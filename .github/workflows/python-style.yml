
# .github/workflows/python-style.yml
name: Ruff lint & format (py only)

on:
  pull_request:
    branches: [ main, master ]
  push:

jobs:
  style-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff lint (.py only, with annotations)
        uses: astral-sh/ruff-action@v3
        with:
          # pass the paths as separate args (no newlines!)
          args: check --output-format=github . src tests

      - name: Ruff format (check only; .py only)
        uses: astral-sh/ruff-action@v3
        with:
          args: format --diff . src tests

      - name: Python syntax check
        run: python -m compileall -q .

