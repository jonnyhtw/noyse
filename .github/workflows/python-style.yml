name: Black formatting & Python syntax check

on:
  pull_request:
    branches: [ main, master ]
  push:

jobs:
  style-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
                   python-version: "3.12"  # pick your project's version

      - name: Syntax check (compile all .py files)
        run: |
          python -m compileall -q .

      - name: Install Black
        run: pip install black

      - name: Check formatting with Black
        run: black --check --diff .

