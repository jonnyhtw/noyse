
# .github/workflows/python-style.yml
name: Ruff lint & format (Black-compatible) + Python syntax check

on:
  pull_request:
    branches: [ main, master ]
  push:

jobs:
  style-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # match your project

      # Run Ruff with built-in annotations; defaults to `ruff check`.
      - name: Ruff (lint)
        uses: astral-sh/ruff-action@v3
        with:
          # Optional: pin Ruff version or pass args
          # version: 0.14.10
          args: check --output-format=github .
          # Using the "github" output format enables inline annotations on PRs
          # (documented in Ruff integrations).
          # https://docs.astral.sh/ruff/integrations/#github-actions

      # Optional: formatting check in CI (no changes allowed)
      # Shows a diff if any file would be reformatted.
      - name: Ruff (format check)
        uses: astral-sh/ruff-action@v3
        with:
          args: format --diff .

      # Keep your syntax check: compile all Python files
      - name: Python syntax check (compileall)
        run: python -m compileall -q .

