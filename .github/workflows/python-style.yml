name: Black formatting & Python syntax check

on:
  pull_request:
    branches: [ main, master ]
  push:

jobs:
  style-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
                   python-version: "3.12"  # pick your project's version

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Check Black formatting (no changes allowed)
        run: black --check --diff .

      - name: Syntax check (compile all .py files)
        run: |
          python -m compileall -q .

