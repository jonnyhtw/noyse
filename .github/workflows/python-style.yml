
# .github/workflows/python-style.yml
name: Ruff lint & format (py only) + Python syntax check

on:
  pull_request:
    branches: [ main, master ]
  push:

jobs:
  style-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lint .py files only (inline annotations via --output-format=github)
      - name: Ruff (lint)
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
          # Limit to .py code locations (adjust as needed)
          src: |
            .
            ./src
            ./tests

      # Optional: format check on .py only (no changes allowed in CI)
      - name: Ruff (format check)
        uses: astral-sh/ruff-action@v3
        with:
          args: format --diff
          src: |
            .
            ./src
            ./tests

      # Syntax check remains (compile Python sources)
      - name: Python syntax check (compileall)
        run: python -m compileall -q .

