
# .github/workflows/python-style.yml
name: Ruff lint & format (py only) + Python syntax check

on:
  pull_request:
    branches: [ main, master ]
  push:

jobs:
  style-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff lint (.py only, with annotations)
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github . src tests

      - name: Ruff format (check only; no changes in CI)
        uses: astral-sh/ruff-action@v3
        with:
          args: format --diff . src tests

      - name: Python syntax check (compile all .py)
        run: python -m compileall -q .

