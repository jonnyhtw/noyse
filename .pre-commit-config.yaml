
# fail_fast: true

repos:
  - repo: local
    hooks:

      - id: remove-unused-imports 
        name: "Hook #1 Ruff checkout for unused import statements"
        language: system
        entry: bash -lc 'ruff check --select F401 noyse.ipynb'
        pass_filenames: false

      - id: remove-unused-imports 
        name: "Hook #2 Ruff checkout for commented out code"
        language: system
        entry: bash -lc 'ruff check --select ERA001 noyse.ipynb'
        pass_filenames: false
    
      - id: jupytext
        name: "Hook #3 Jupytext: ipynb -> py (noyse)"
        language: system
        entry: bash -lc 'jupytext --to py noyse.ipynb'
        pass_filenames: false

