
fail_fast: true

repos:
  - repo: local
    hooks:
 
      - id: jupytext
        name: "Jupytext"
        language: python
        entry: jupytext
        args: [--sync, noyse.py]
        pass_filenames: false

      - id: Ruff
        name: "Ruff"
        language: python
        entry: ruff
        args: [check, noyse.py]
        pass_filenames: false
